<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="75%">
      <stop offset="0" stop-color="#16244a"/>
      <stop offset="0.6" stop-color="#0c1530"/>
      <stop offset="1" stop-color="#060a18"/>
    </radialGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#001a8c"/>
      <stop offset="0.45" stop-color="#0a47e0"/>
      <stop offset="0.85" stop-color="#2f86ff"/>
      <stop offset="1" stop-color="#7cc2ff"/>
    </linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00238f"/>
      <stop offset="0.5" stop-color="#1366f0"/>
      <stop offset="1" stop-color="#a6d8ff"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <!-- one ribbon-like petal, base at origin, pointing right -->
    <path id="petal" d="M0,0 C90,-150 330,-210 470,-120 C540,-75 545,-10 500,20 C420,-40 300,-55 190,-20 C110,5 45,20 0,0 Z"/>
    <path id="edge" d="M500,20 C420,-40 300,-55 190,-20 C110,5 45,20 0,0" fill="none"/>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <g transform="translate(960 580) scale(0.82)">
    <!-- ambient shadow under the bloom -->
    <ellipse cx="0" cy="40" rx="560" ry="380" fill="#3a7bff" opacity="0.35" filter="url(#shadow)"/>

    <!-- back layer -->
    <g filter="url(#soft)">
      <use href="#petal" fill="url(#p2)" transform="rotate(-160) scale(1.25)"/>
      <use href="#petal" fill="url(#p2)" transform="rotate(-120) scale(1.3)"/>
      <use href="#petal" fill="url(#p2)" transform="rotate(-75) scale(1.2)"/>
      <use href="#petal" fill="url(#p2)" transform="rotate(-25) scale(1.3)"/>
      <use href="#petal" fill="url(#p2)" transform="rotate(20) scale(1.15)"/>
      <use href="#petal" fill="url(#p2)" transform="rotate(70) scale(1.1)"/>
      <use href="#petal" fill="url(#p2)" transform="rotate(130) scale(1.15)"/>
      <use href="#petal" fill="url(#p2)" transform="rotate(175) scale(1.2)"/>
    </g>

    <!-- middle layer -->
    <g filter="url(#soft)">
      <use href="#petal" fill="url(#p1)" transform="rotate(-140) scale(0.95)"/>
      <use href="#petal" fill="url(#p1)" transform="rotate(-95) scale(1)"/>
      <use href="#petal" fill="url(#p1)" transform="rotate(-50) scale(1.05)"/>
      <use href="#petal" fill="url(#p1)" transform="rotate(-5) scale(1)"/>
      <use href="#petal" fill="url(#p1)" transform="rotate(45) scale(0.9)"/>
      <use href="#petal" fill="url(#p1)" transform="rotate(100) scale(0.95)"/>
      <use href="#petal" fill="url(#p1)" transform="rotate(150) scale(0.95)"/>
      <use href="#petal" fill="url(#p1)" transform="rotate(200) scale(1)"/>
    </g>
    <g stroke="url(#hl)" stroke-width="5" stroke-linecap="round">
      <use href="#edge" transform="rotate(-140) scale(0.95)"/>
      <use href="#edge" transform="rotate(-95) scale(1)"/>
      <use href="#edge" transform="rotate(-50) scale(1.05)"/>
      <use href="#edge" transform="rotate(-5) scale(1)"/>
      <use href="#edge" transform="rotate(45) scale(0.9)"/>
      <use href="#edge" transform="rotate(100) scale(0.95)"/>
      <use href="#edge" transform="rotate(150) scale(0.95)"/>
      <use href="#edge" transform="rotate(200) scale(1)"/>
    </g>

    <!-- front layer -->
    <g>
      <use href="#petal" fill="url(#p1)" transform="rotate(-115) scale(0.6)"/>
      <use href="#petal" fill="url(#p1)" transform="rotate(-30) scale(0.62)"/>
      <use href="#petal" fill="url(#p1)" transform="rotate(60) scale(0.58)"/>
      <use href="#petal" fill="url(#p1)" transform="rotate(160) scale(0.6)"/>
    </g>
    <g stroke="url(#hl)" stroke-width="4" stroke-linecap="round">
      <use href="#edge" transform="rotate(-115) scale(0.6)"/>
      <use href="#edge" transform="rotate(-30) scale(0.62)"/>
      <use href="#edge" transform="rotate(60) scale(0.58)"/>
      <use href="#edge" transform="rotate(160) scale(0.6)"/>
    </g>
    <circle r="70" fill="#001a8c" opacity="0.55" filter="url(#soft)"/>
  </g>
</svg>
